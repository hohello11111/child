<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어린이의 꿈을 위해 - 카카오맵 장소 검색</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- 카카오맵 JavaScript SDK (장소 검색 서비스 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=37f4e53b721e17a8cc7aeae470ae2883&autoload=false&libraries=services"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }

        /* 커스텀 인포윈도우 스타일 */
        .info-window-custom {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 2px solid #e5e7eb;
            font-size: 13px;
            color: #1f2937;
            width: 240px;
            white-space: normal;
            backdrop-filter: blur(4px);
        }

        /* 내 위치 펄스 애니메이션 */
        .my-location-badge {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
            border: 2px solid white;
            white-space: nowrap;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* 악마(학원) 마커 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        .evil-marker:hover {
            animation: shake 0.3s infinite;
        }

        /* 착한(문화시설) 마커 둥둥 애니메이션 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .good-marker {
            animation: float 2s infinite ease-in-out;
        }

        /* 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden text-gray-800 flex flex-col md:flex-row">

    <!-- 왼쪽 사이드바 -->
    <aside class="w-full md:w-[400px] lg:w-[420px] h-1/2 md:h-full bg-white flex flex-col shadow-2xl z-10 border-r border-slate-200">
        <!-- 헤더 -->
        <header class="p-4 bg-gradient-to-r from-sky-400 to-indigo-500 text-white flex items-center justify-between shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-500 font-bold text-xl shadow-inner">
                    <i class="fa-solid fa-child-reaching"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg leading-tight">어린이의 꿈 지도</h1>
                    <p class="text-xs text-sky-100 font-medium">우리의 미래를 탐색하세요</p>
                </div>
            </div>
        </header>

        <!-- 검색 및 카테고리 영역 -->
        <div class="p-4 border-b border-slate-100 bg-slate-50 space-y-3 shrink-0">
            <form id="searchForm" onsubmit="searchPlacesByKeyword(event)" class="relative flex items-center">
                <input 
                    type="text" 
                    id="keywordInput" 
                    placeholder="검색어 또는 주소를 입력하세요" 
                    class="w-full pl-10 pr-20 py-2.5 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all shadow-sm"
                />
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-sm"></i>
                <button type="submit" class="absolute right-1.5 px-3.5 py-1.5 bg-indigo-500 hover:bg-indigo-600 text-white font-medium rounded-lg text-xs transition-colors shadow-sm">
                    검색
                </button>
            </form>

            <!-- 카테고리 탭 -->
            <div class="grid grid-cols-4 gap-2 text-[11px] font-bold">
                <button onclick="searchByCategory('PS3')" class="flex flex-col items-center justify-center gap-1 p-2 bg-green-50 hover:bg-green-100 border border-green-200 rounded-xl text-green-700 transition-all">
                    <i class="fa-solid fa-baby text-lg"></i>어린이집
                </button>
                <button onclick="searchByCategory('SC4')" class="flex flex-col items-center justify-center gap-1 p-2 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-xl text-blue-700 transition-all">
                    <i class="fa-solid fa-school text-lg"></i>학교
                </button>
                <button onclick="searchByCategory('AC5')" class="flex flex-col items-center justify-center gap-1 p-2 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl text-red-700 transition-all">
                    <i class="fa-solid fa-book-skull text-lg"></i>학원
                </button>
                <button onclick="searchByCategory('CT1')" class="flex flex-col items-center justify-center gap-1 p-2 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl text-amber-700 transition-all">
                    <i class="fa-solid fa-palette text-lg"></i>문화시설
                </button>
            </div>
        </div>

        <div id="statusMessage" class="px-4 py-2 bg-indigo-50 text-indigo-800 text-xs flex items-center justify-between border-b border-indigo-100 hidden shrink-0">
            <span id="statusText" class="font-medium">검색 중입니다...</span>
            <span id="resultCount" class="font-bold text-indigo-900">0개</span>
        </div>

        <!-- 결과 리스트 -->
        <div class="flex-1 overflow-y-auto p-3 space-y-2.5" id="placesList">
            <div class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-300"></i>
                <p class="text-sm font-medium">카테고리 버튼을 누르거나<br>원하는 장소를 검색해보세요!</p>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <footer class="p-3 bg-white border-t border-slate-200 flex items-center justify-center gap-1 text-xs shrink-0" id="pagination"></footer>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main class="relative w-full h-1/2 md:h-full md:flex-1 bg-slate-200">
        <!-- 지도가 그려질 영역 -->
        <div id="map" class="w-full h-full"></div>

        <!-- 내 위치로 돌아가기 버튼 -->
        <button 
            onclick="requestUserGeolocation()" 
            class="absolute bottom-6 right-6 z-20 w-12 h-12 bg-white text-blue-500 rounded-full shadow-lg border border-slate-200 flex items-center justify-center transition-all hover:scale-110 active:scale-95"
            title="내 위치로 이동"
        >
            <i class="fa-solid fa-crosshairs text-xl"></i>
        </button>

        <!-- 토스트 알림 -->
        <div id="mapToast" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 bg-slate-900/90 backdrop-blur-md text-white text-xs px-4 py-2 rounded-full shadow-xl flex items-center gap-2 opacity-0 transition-opacity duration-300 pointer-events-none whitespace-nowrap">
            <i class="fa-solid fa-circle-info text-sky-400"></i>
            <span id="toastMessage">안내 메시지</span>
        </div>
    </main>

    <script>
        // 글로벌 변수 선언
        let map = null;
        let placesService = null;
        let markers = [];                  // 검색 결과 마커 배열
        let clickMarkers = [];             // 사용자 클릭으로 생성된 마커 배열
        let infoWindow = null;
        let currentLocationMarker = null;  // 내 위치 마커
        let userCurrentPosition = null;    // 내 위치 좌표
        let dreamLine = null;              // 문화시설 연결선
        let currentActiveCategory = '';    // 현재 활성화된 카테고리

        // 스크립트 로드 완료 후 실행
        window.addEventListener('DOMContentLoaded', function() {
            // 카카오맵 안전 로드
            kakao.maps.load(function() {
                initMap();
            });
        });

        // 1. 지도 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map');
            // 기본 서울 좌표
            const defaultPosition = new kakao.maps.LatLng(37.566826, 126.9786567); 

            const mapOptions = {
                center: defaultPosition,
                level: 4
            };

            // 맵 객체 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // [요구사항] 지형도(TERRAIN) 표시 및 줌 컨트롤러 추가
            map.setMapTypeId(kakao.maps.MapTypeId.TERRAIN);
            const zoomControl = new kakao.maps.ZoomControl();
            map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            // 인포윈도우(팝업창) 생성
            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 100,
                removable: true
            });

            // 장소 검색 객체 생성
            placesService = new kakao.maps.services.Places();

            // ★ 지도가 모두 초기화된 후 즉시 사용자 위치 가져오기 실행 ★
            requestUserGeolocation();

            // 지도 클릭 시 마커 생성
            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                addUserClickMarker(mouseEvent.latLng);
            });

            // 윈도우 크기 변경 시 지도 리사이즈 처리 (지도 짤림 방지)
            window.addEventListener('resize', function() {
                map.relayout();
            });
        }

        // 2. 내 위치 권한 요청 및 지도 반영
        function requestUserGeolocation() {
            if (navigator.geolocation) {
                showToast("위치 권한을 확인하고 있습니다...");
                
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        userCurrentPosition = new kakao.maps.LatLng(lat, lng);

                        // ★ 지도를 내 위치로 이동 및 내 위치 마커 표시 ★
                        map.setCenter(userCurrentPosition);
                        displayCurrentLocationBadge(userCurrentPosition);
                        showToast("현재 위치로 지도를 이동했습니다!");
                    },
                    function(error) {
                        console.warn("위치 정보 가져오기 실패:", error);
                        showToast("위치 권한이 거부되어 기본 위치에서 시작합니다.");
                        userCurrentPosition = map.getCenter();
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                showToast("브라우저가 위치 기능을 지원하지 않습니다.");
            }
        }

        // 2-1. 내 위치 커스텀 오버레이(마커) 생성
        function displayCurrentLocationBadge(position) {
            if (currentLocationMarker) currentLocationMarker.setMap(null); // 기존 마커 지우기

            const content = `
                <div class="my-location-badge flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-location-crosshairs"></i> 내 위치
                </div>
            `;
            
            currentLocationMarker = new kakao.maps.CustomOverlay({
                map: map,
                position: position,
                content: content,
                yAnchor: 1,
                zIndex: 50
            });
        }

        // 3. 키워드 검색 로직
        function searchPlacesByKeyword(event) {
            if (event) event.preventDefault();
            const keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) return alert('검색어나 주소를 입력하세요!');
            
            currentActiveCategory = '';
            updateStatusMessage(`'${keyword}' 검색 중...`, 0);
            placesService.keywordSearch(keyword, placesSearchCallback);
        }

        // 4. 카테고리 검색 로직
        function searchByCategory(categoryCode) {
            currentActiveCategory = categoryCode;
            const center = map.getCenter();
            
            const catNames = { 'PS3': '어린이집/유치원', 'SC4': '학교', 'AC5': '학원', 'CT1': '문화시설' };
            updateStatusMessage(`주변 '${catNames[categoryCode]}' 탐색 중...`, 0);

            placesService.categorySearch(categoryCode, placesSearchCallback, {
                location: center,
                radius: 5000, // 5km 반경 검색
                useMapBounds: false
            });
        }

        // 검색 콜백 함수
        function placesSearchCallback(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data); // 리스트 및 마커 표시
                displayPagination(pagination); // 하단 페이지 번호
                updateStatusMessage(`탐색 완료`, data.length);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                clearSearchUI();
                showEmptyState('이 주변에는 결과가 없습니다.');
                updateStatusMessage('결과 없음', 0);
            } else {
                clearSearchUI();
                showEmptyState('검색 중 오류가 발생했습니다.');
            }
        }

        // 5. 검색 결과를 지도 및 리스트에 반영 ★수정된 핵심 부분★
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();

            removeMarkers(); // 이전 마커 초기화
            listEl.innerHTML = '';

            places.forEach((place, index) => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                bounds.extend(placePosition); // 지도가 한눈에 보이게 영역 확장

                const catCode = place.category_group_code || currentActiveCategory;

                // 마커 생성
                const marker = addCategoryCustomMarker(placePosition, catCode, place.place_name);
                
                // 리스트 아이템 생성
                const itemEl = createListItem(place, index, catCode);
                
                // 리스트/마커 클릭 이벤트 연결
                bindEvents(marker, itemEl, place, placePosition, catCode);

                listEl.appendChild(itemEl);
            });

            // 지도 영역 재조정
            map.setBounds(bounds);
        }

        // 6. 카테고리별 디자인 마커 생성
        function addCategoryCustomMarker(position, catCode, title) {
            // HTML 문자열로 오버레이 내용 구성
            let iconHtml = '';
            let zIndex = 10;
            
            if (catCode === 'AC5') { // 학원
                iconHtml = `
                    <div class="evil-marker flex items-center justify-center w-10 h-10 bg-black border-2 border-red-600 rounded-full shadow-[0_0_15px_rgba(220,38,38,0.8)] text-red-500 text-xl cursor-pointer">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                `;
                zIndex = 30;
            } else if (catCode === 'CT1') { // 문화시설
                iconHtml = `
                    <div class="good-marker flex items-center justify-center w-12 h-12 bg-gradient-to-tr from-amber-300 to-yellow-500 border-2 border-white rounded-full shadow-[0_0_20px_rgba(245,158,11,0.8)] text-white text-2xl cursor-pointer">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                `;
                zIndex = 30;
            } else if (catCode === 'PS3') { // 어린이집
                iconHtml = `<div class="flex items-center justify-center w-9 h-9 bg-green-500 border-2 border-white rounded-full shadow-md text-white cursor-pointer"><i class="fa-solid fa-baby-carriage"></i></div>`;
            } else if (catCode === 'SC4') { // 학교
                iconHtml = `<div class="flex items-center justify-center w-9 h-9 bg-blue-500 border-2 border-white rounded-full shadow-md text-white cursor-pointer"><i class="fa-solid fa-school"></i></div>`;
            } else { // 기타
                iconHtml = `<div class="flex items-center justify-center w-8 h-8 bg-slate-700 border-2 border-white rounded-full shadow-md text-white cursor-pointer"><i class="fa-solid fa-location-dot"></i></div>`;
            }

            // 부모 div를 생성하고 이벤트를 직접 붙여야 카카오맵에서 정상 작동합니다.
            const wrapper = document.createElement('div');
            wrapper.innerHTML = iconHtml;
            wrapper.onclick = function() {
                displayCategoryInfoWindow(position, title, catCode);
                map.panTo(position);
                drawDreamLine(catCode, position);
            };

            const customOverlay = new kakao.maps.CustomOverlay({
                map: map, // ★ 여기서 map을 세팅하여 지도에 바로 그림 ★
                position: position,
                content: wrapper,
                yAnchor: 1,
                zIndex: zIndex
            });

            markers.push(customOverlay);
            return customOverlay;
        }

        // 마커 상세 정보 팝업
        function displayCategoryInfoWindow(position, title, catCode) {
            let descHtml = '';
            if (catCode === 'AC5') {
                descHtml = `
                    <div class="text-red-600 font-black mb-1 text-sm"><i class="fa-solid fa-skull-crossbones mr-1"></i> 경고: 위험 구역</div>
                    <p class="text-xs text-slate-600 leading-relaxed font-medium">이곳 <b>${title}</b>에 발을 들이면 선행학습과 숙제의 굴레에 갇힙니다. 도망치세요! 😱</p>
                `;
            } else if (catCode === 'CT1') {
                descHtml = `
                    <div class="text-amber-500 font-black mb-1 text-sm"><i class="fa-solid fa-star mr-1"></i> 축복: 마법의 공간</div>
                    <p class="text-xs text-slate-600 leading-relaxed font-medium"><b>${title}</b>에서는 예술을 즐기며, 당신의 인생이 한층 눈부시게 빛납니다! ✨</p>
                `;
            } else if (catCode === 'PS3' || catCode === 'SC4') {
                descHtml = `
                    <div class="text-blue-600 font-black mb-1 text-sm"><i class="fa-solid fa-face-smile-beam mr-1"></i> 배움의 터전</div>
                    <p class="text-xs text-slate-600 leading-relaxed font-medium"><b>${title}</b>은(는) 새로운 세상을 배우며 성장하는 따뜻한 공간입니다. 🌱</p>
                `;
            } else {
                descHtml = `<div class="font-bold mb-1">${title}</div><p class="text-xs text-slate-500">선택된 장소입니다.</p>`;
            }

            infoWindow.setContent(`<div class="info-window-custom">${descHtml}</div>`);
            infoWindow.setPosition(position);
            infoWindow.open(map); // 위치를 지정하고 지도에 오픈
        }

        // [기능 3] 꿈의 무지개 길 (내 위치와 문화시설 선 연결)
        function drawDreamLine(catCode, targetPosition) {
            if (dreamLine) { dreamLine.setMap(null); dreamLine = null; }
            if (catCode === 'CT1' && userCurrentPosition) {
                dreamLine = new kakao.maps.Polyline({
                    path: [userCurrentPosition, targetPosition],
                    strokeWeight: 6,
                    strokeColor: '#f59e0b',
                    strokeOpacity: 0.9,
                    strokeStyle: 'shortdashdot'
                });
                dreamLine.setMap(map);
                showToast("당신의 위치에서 문화시설까지 꿈의 길이 열렸습니다! ✨");
            }
        }

        // 지도 여백 클릭 시 커스텀 핀 꽂기
        function addUserClickMarker(latLng) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = `<div class="flex items-center justify-center w-8 h-8 bg-purple-500 border-2 border-white rounded-full shadow-lg text-white cursor-pointer"><i class="fa-solid fa-thumbtack"></i></div>`;
            wrapper.onclick = function() {
                infoWindow.setContent(`<div class="info-window-custom"><b class="text-purple-600">직접 찍은 위치!</b><br><span class="text-xs text-slate-500">여기에 새로운 아지트를 만들어볼까요?</span></div>`);
                infoWindow.setPosition(latLng);
                infoWindow.open(map);
            };

            const clickMarker = new kakao.maps.CustomOverlay({
                map: map,
                position: latLng,
                content: wrapper,
                yAnchor: 1
            });
            clickMarkers.push(clickMarker);
            showToast("새로운 마커를 지도에 꽂았습니다 📌");
        }

        // 리스트 클릭 이벤트 바인딩
        function bindEvents(marker, itemEl, place, position, catCode) {
            itemEl.addEventListener('click', function() {
                displayCategoryInfoWindow(position, place.place_name, catCode);
                map.panTo(position); // 클릭 시 해당 장소로 지도 이동
                drawDreamLine(catCode, position);
            });
        }

        // 리스트 HTML 그리기
        function createListItem(place, index, catCode) {
            const el = document.createElement('div');
            let bgClass = 'bg-white hover:bg-slate-50';
            if (catCode === 'AC5') bgClass = 'bg-red-50/30 hover:bg-red-100 border-red-100';
            if (catCode === 'CT1') bgClass = 'bg-amber-50/50 hover:bg-amber-100 border-amber-100';

            el.className = `p-3 ${bgClass} border border-slate-200 rounded-xl transition-all cursor-pointer shadow-sm group`;
            const categoryName = place.category_name ? place.category_name.split(' > ').pop() : '장소';
            const address = place.road_address_name || place.address_name;

            el.innerHTML = `
                <div class="flex items-start gap-3">
                    <span class="w-6 h-6 rounded-lg bg-slate-800 text-white font-bold text-xs flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
                        ${index + 1}
                    </span>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-1 mb-1">
                            <h2 class="font-bold text-slate-800 text-sm truncate group-hover:text-indigo-600">${place.place_name}</h2>
                            <span class="text-[10px] bg-white border border-slate-200 text-slate-500 px-1.5 py-0.5 rounded flex-shrink-0">${categoryName}</span>
                        </div>
                        <p class="text-xs text-slate-500 truncate mb-1"><i class="fa-solid fa-map-pin text-slate-300 mr-1"></i>${address}</p>
                    </div>
                </div>
            `;
            return el;
        }

        function displayPagination(pagination) {
            const paginationEl = document.getElementById('pagination');
            paginationEl.innerHTML = '';
            for (let i = 1; i <= pagination.last; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `w-7 h-7 rounded-lg text-xs font-semibold transition-all ${
                    i === pagination.current ? 'bg-indigo-500 text-white shadow-md scale-110' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`;
                pageBtn.innerText = i;
                pageBtn.addEventListener('click', () => pagination.gotoPage(i));
                paginationEl.appendChild(pageBtn);
            }
        }

        function removeMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
            if (infoWindow) infoWindow.close();
            if (dreamLine) { dreamLine.setMap(null); dreamLine = null; }
        }

        function clearSearchUI() {
            removeMarkers();
            document.getElementById('placesList').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
        }

        function showEmptyState(message) {
            document.getElementById('placesList').innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center"><i class="fa-solid fa-ghost text-3xl mb-2 text-slate-300"></i><p class="text-sm font-medium text-slate-600 mb-1">${message}</p></div>`;
        }

        function updateStatusMessage(statusText, count) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.classList.remove('hidden');
            document.getElementById('statusText').innerText = statusText;
            document.getElementById('resultCount').innerText = `${count}개 찾음`;
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('mapToast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
